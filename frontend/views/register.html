<section class="featured-section login-section">

    <div class="login-container">

        <p class="eyebrow">JOIN THE COMMUNITY</p>

        <h2>Create Account</h2>

        <p class="login-description">
            Create your CarHub account and join the automotive community.
        </p>

        <form class="login-form">

            <div class="form-group">
                <label for="register-name">Full Name</label>
                <input
                    type="text"
                    id="register-name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="register-email">Email Address</label>
                <input
                    type="email"
                    id="register-email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="register-password">Password</label>
                <input
                    type="password"
                    id="register-password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Confirm your password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit" class="primary-button login-submit">
                Create Account
            </button>

        </form>

        <p class="login-register-link">
            Already have an account?
            <a href="#login" data-page="login">Login here</a>
        </p>

    </div>

</section>
