<section class="featured-section login-section">

    <div class="login-container">

        <p class="eyebrow">WELCOME BACK</p>

        <h2>Login to CarHub</h2>

        <p class="login-description">
            Sign in to explore cars and connect with the automotive community.
        </p>

        <form class="login-form">

            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input
                    type="email"
                    id="login-email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>
                <input
                    type="password"
                    id="login-password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="primary-button login-submit">
                Login
            </button>

        </form>

        <p class="login-register-link">
            Don't have an account?
            <a href="#register" data-page="register">Register here</a>
        </p>

    </div>

</section>
